# fly.io app definition for the gymIQ worker (hosted agent runtime, see worker/README.md).
# Lives at the repo root so the Docker build context can see unified/.
#   fly deploy            (from the repo root)
app = "gymiq-worker"
primary_region = "lhr"

[build]
  dockerfile = "worker/Dockerfile"

[env]
  PORT = "8080"
  PLAYBOOK_MODEL = "claude-haiku-4-5"
  MAX_BUDGET_USD = "0.50"
  ARTIFACT_BUCKET = "iq-artifacts"
  RESEND_FROM = "gymIQ <brief@gymiq.ai>"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: runs are accepted with 202 and finish in the background,
  # so the machine must not be auto-stopped mid-run. One shared-cpu-1x is ~$5.70/mo.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    hard_limit = 4
    soft_limit = 2

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
